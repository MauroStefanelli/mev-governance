services:
  postgres:
    image: postgres:15-alpine
    container_name: mev-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=MEV-Governance
      - POSTGRES_USER=mev_user
      - POSTGRES_PASSWORD=Mev2025!
    volumes:
      - /share/Public/mev-data/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pdf-parser:
    image: ghcr.io/maurostefanelli/mev-pdf-parser:latest
    container_name: mev-pdf-parser
    restart: unless-stopped
    environment:
      - PORT=8000
    ports:
      - "5002:8000"

  backend:
    image: ghcr.io/maurostefanelli/mev-governance-backend:latest
    container_name: mev-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_KEY=MEV-Governance-SuperSecretKey-2025-Capgemini!
      - JWT_ISSUER=mev-governance
      - JWT_AUDIENCE=mev-governance-ui
      - DATABASE_DIRECT_URL=Host=postgres;Port=5432;Database=MEV-Governance;Username=mev_user;Password=Mev2025!
      - PDF_PARSER_URL=http://pdf-parser:8000
      - SKIP_PARSER_WARMUP=true
    volumes:
      - /share/Public/mev-data:/data
    ports:
      - "4000:5000"
    depends_on:
      - postgres
      - pdf-parser

  frontend:
    image: ghcr.io/maurostefanelli/mev-governance-frontend:qnap
    container_name: mev-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
