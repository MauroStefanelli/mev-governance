services:

  # ── PDF Parser (dev) ──────────────────────────────────────────────────────────
  - type: web
    name: mev-pdf-parser-dev
    runtime: docker
    dockerfilePath: ./mev-pdf-parser/Dockerfile
    dockerContext: ./mev-pdf-parser
    branch: develop
    autoDeploy: true
    plan: free

  # ── Backend ASP.NET Core (dev) ────────────────────────────────────────────────
  - type: web
    name: mev-governance-backend-dev
    runtime: docker
    dockerfilePath: ./mev-governance-backend/Dockerfile
    dockerContext: ./mev-governance-backend
    branch: develop
    autoDeploy: true
    plan: free
    envVars:
      - key: JWT_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: mev-governance-dev
      - key: JWT_AUDIENCE
        value: mev-governance-ui-dev
      - key: ADMIN_PASSWORD
        value: Admin2025!
      - key: DATABASE_DIRECT_URL
        sync: false
        # Imposta manualmente su Render: Settings → Database su Supabase → Direct connection URI
        # postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
        # Lo schema "dev" viene creato automaticamente dal backend al primo avvio (DB_SCHEMA=dev)
      - key: CORS_ORIGINS
        value: https://mev-governance-frontend-dev.onrender.com
      - key: PDF_PARSER_URL
        value: https://mev-pdf-parser-dev.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: DB_SCHEMA
        value: dev

  # ── Frontend React (dev) ──────────────────────────────────────────────────────
  - type: web
    name: mev-governance-frontend-dev
    runtime: docker
    dockerfilePath: ./mev-governance-ui/Dockerfile
    dockerContext: ./mev-governance-ui
    branch: develop
    autoDeploy: true
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        value: https://mev-governance-backend-dev.onrender.com
