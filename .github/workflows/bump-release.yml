name: Bump Release Tag

on:
  push:
    branches: [ main ]

jobs:
  bump-release:
    name: Bump release and update runtime config
    runs-on: ubuntu-latest
    # Skip running when the push is performed by the workflow itself (prevents loop)
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure RELEASE_COUNTER exists and increment
        id: bump
        run: |
          COUNTER_FILE=RELEASE_COUNTER
          if [ ! -f "$COUNTER_FILE" ]; then echo "0" > "$COUNTER_FILE"; fi
          CUR=$(cat "$COUNTER_FILE" | tr -d '\r' )
          # handle empty
          if [ -z "$CUR" ]; then CUR=0; fi
          NEXT=$((10#$CUR + 1))
          printf "%d" "$NEXT" > "$COUNTER_FILE"
          printf "%03d" "$NEXT" > RELEASE_COUNTER_PAD
          echo "release_number=$NEXT" >> $GITHUB_OUTPUT
          echo "release_padded=$(cat RELEASE_COUNTER_PAD)" >> $GITHUB_OUTPUT

      - name: Update public/env-config.js with new REACT_APP_RELEASE
        run: |
          PAD=$(cat RELEASE_COUNTER_PAD)
          REL="PROD_REL_${PAD}"
          echo "// Generated by CI: release ${REL}" > public/env-config.js
          echo "window._env_ = {" >> public/env-config.js
          # preserve existing API url if present
          if [ -f public/env-config.js.bak ]; then :; fi
          # Keep REACT_APP_API_URL empty (Render static will set at build-time if needed)
          echo "  REACT_APP_API_URL: \"\"," >> public/env-config.js
          echo "  REACT_APP_RELEASE: \"${REL}\"" >> public/env-config.js
          echo "};" >> public/env-config.js
          git add public/env-config.js RELEASE_COUNTER
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: bump release to ${REL} [auto-release]" || echo "no changes to commit"
          git push origin HEAD:main
