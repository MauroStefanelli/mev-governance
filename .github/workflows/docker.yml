name: Build and Push Images

on:
  push:
    branches:
      - main
      - develop

jobs:

  # ══════════════════════════════════════════════════════════════
  #  PRODUZIONE  (branch: main)  →  tag :latest  /  :qnap
  # ══════════════════════════════════════════════════════════════

  frontend-render-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-frontend:latest
          build-args: |
            REACT_APP_API_URL=https://mev-governance-backend.onrender.com

  frontend-qnap-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-frontend:qnap
          build-args: |
            REACT_APP_API_URL=http://192.168.1.144:4000

  backend-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-backend:latest

  parser-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-pdf-parser
          file: ./mev-pdf-parser/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ghcr.io/maurostefanelli/mev-pdf-parser:latest

  # ══════════════════════════════════════════════════════════════
  #  SVILUPPO  (branch: develop)  →  tag :dev  /  :qnap-dev
  # ══════════════════════════════════════════════════════════════

  frontend-render-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-frontend:dev
          build-args: |
            REACT_APP_API_URL=https://mev-governance-backend-dev.onrender.com

  frontend-qnap-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-frontend:qnap-dev
          build-args: |
            REACT_APP_API_URL=http://192.168.1.144:4001

  backend-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-governance-backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/maurostefanelli/mev-governance-backend:dev

  parser-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./mev-pdf-parser
          file: ./mev-pdf-parser/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ghcr.io/maurostefanelli/mev-pdf-parser:dev
