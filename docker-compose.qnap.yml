# MEV Governance su NAS QNAP (Container Station) — ambiente DEV, stessi dati di Render.
#
# Come si usa: vedi docs/QNAP.md.
#  - Da SSH sul NAS:  copiare .env.qnap.example in ".env" (stessa cartella), compilarlo, poi  docker compose -f docker-compose.qnap.yml up -d
#  - Da Container Station (Applications -> Create Application): il YAML va incollato e le variabili ${...} NON e' documentato che vengano sostituite.
#    Per questo, sul computer:  python3 scripts/qnap_render_compose.py  produce docker-compose.qnap.rendered.yml con tutti i valori gia' scritti.
#
# Il database e' su questo NAS: un Postgres (servizio "postgres") il cui contenuto viene COPIATO UNA VOLTA dal database di Render/Supabase dal servizio "db-import".
# Dopo la copia i due database sono indipendenti: quello del NAS non si aggiorna da solo e le modifiche fatte qui non tornano su Render.
# Nessuna password e' scritta in questo file: tutte vengono dal file ".env", che non va mai messo nel repository.

services:

  postgres:
    image: postgres:17-alpine
    container_name: mev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mev}
      POSTGRES_DB: ${POSTGRES_DB:-mev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?compilare POSTGRES_PASSWORD nel file .env}
    volumes:
      - ${PG_DIR:-./mev-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mev} -d ${POSTGRES_DB:-mev}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # nessuna porta pubblicata: il database e' raggiungibile solo dai container dell'app

  # Copia lo schema dall'origine al database del NAS e poi TERMINA (non e' un servizio che resta acceso). Il backend parte solo se la copia e' riuscita.
  # Idempotente: se i dati ci sono gia' non fa niente (IMPORT_MODE=once). Vedi scripts/qnap-db-import.sh.
  db-import:
    image: postgres:17-alpine
    container_name: mev-db-import
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IMPORT_MODE: ${IMPORT_MODE:-once}
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
      DB_SCHEMA: ${DB_SCHEMA:-dev}
      TARGET_HOST: postgres
      TARGET_PORT: "5432"
      TARGET_DB: ${POSTGRES_DB:-mev}
      TARGET_USER: ${POSTGRES_USER:-mev}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/qnap-db-import.sh:/import.sh:ro
    command: ["sh", "/import.sh"]

  pdf-parser:
    image: ghcr.io/maurostefanelli/mev-pdf-parser:${IMAGE_TAG:-dev}
    container_name: mev-pdf-parser
    restart: unless-stopped
    environment:
      PORT: "8000"
    # nessuna porta pubblicata: lo usa solo il backend, dentro la rete del compose

  backend:
    image: ghcr.io/maurostefanelli/mev-governance-backend:${IMAGE_TAG:-dev}
    container_name: mev-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DB_SCHEMA: ${DB_SCHEMA:-dev}
      # Il Postgres del NAS: rete interna, senza SSL. L'app aggiunge da sola il search path dello schema.
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-mev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mev}
      JWT_KEY: ${JWT_KEY:?compilare JWT_KEY nel file .env}
      JWT_ISSUER: ${JWT_ISSUER:-mev-governance-dev}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mev-governance-ui-dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?compilare ADMIN_PASSWORD nel file .env}
      PDF_PARSER_URL: http://pdf-parser:8000
      SKIP_PARSER_WARMUP: "true"
      # Con il proxy del frontend il browser parla sempre con lo stesso indirizzo della pagina, quindi il CORS non entra in gioco;
      # restano elencati per chi apre direttamente il backend (es. per un controllo).
      CORS_ORIGINS: http://${NAS_HOST:-192.168.1.144}:${HTTP_PORT:-3001},https://${NAS_HOST:-192.168.1.144}:${HTTPS_PORT:-3443}
      # Il limite di memoria del .NET e' pensato per Render free (400 MB). Il TS-433 ha 4 GB in tutto: lasciarlo cosi'.
      DOTNET_GCHeapHardLimit: ${DOTNET_GCHeapHardLimit:-419430400}
    volumes:
      - ${DATA_DIR:-./mev-data}:/data
    # il backend NON e' pubblicato sulla rete: ci arriva solo il frontend. Per provarlo a mano, togliere il commento alla riga seguente.
    # ports: ["${BACKEND_PORT:-4001}:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
      pdf-parser:
        condition: service_started

  frontend:
    image: ghcr.io/maurostefanelli/mev-governance-frontend:${IMAGE_TAG:-dev}
    container_name: mev-frontend
    restart: unless-stopped
    environment:
      # BACKEND_URL attiva il proxy: la pagina chiama /api sullo stesso indirizzo (HTTP e HTTPS), nginx inoltra al backend.
      BACKEND_URL: http://backend:5000
      PUBLIC_HOST: ${NAS_HOST:-192.168.1.144}
      HTTP_PORT: "80"
      HTTPS_PORT: "8443"
      MAX_BODY: 60m
    volumes:
      # Facoltativo: un certificato HTTPS vero (server.crt e server.key). Senza, il frontend ne genera uno autofirmato per PUBLIC_HOST.
      - ${CERTS_DIR:-./mev-certs}:/certs:ro
    ports:
      - "${HTTP_PORT:-3001}:80"
      - "${HTTPS_PORT:-3443}:8443"
    depends_on:
      - backend
